<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff5f8;
        }

        nav {
            background-color: #f7c8d8;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            color: #713d53;
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .menu a {
            text-decoration: none;
            color: #713d53;
            font-size: 16px;
            font-weight: bold;
        }

        .menu a:hover {
            color: #ffffff;
        }

        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            color: #713d53;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .content p {
            color: #765d68;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Mobile responsive design */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 18px;
            }

            .menu {
                flex-direction: column;
                align-items: center;
                gap: 15px;
                width: 100%;
            }

            .content {
                padding: 60px 20px;
            }

            .content h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

        <ul class="menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="content" id="home">
        <h1>Welcome to My Website!</h1>
        <p>This is a simple and responsive navigation menu.</p>
        <p>Resize your browser to see how the menu adjusts.</p>
    </section>

</body>
</html>
